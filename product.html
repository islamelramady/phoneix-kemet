<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المنتج | Phoenix Kemet</title>
  <link rel="icon" type="image/png" href="images/emblem.png">
  <link rel="stylesheet" href="css/all.css?v=5">
  <link rel="stylesheet" href="css/style.css?v=5">
  <script src="js/products.js?v=5" defer></script>
  <script src="js/store.js?v=5" defer></script>
  <script src="js/layout.js?v=5" defer></script>
  <script src="js/product.js?v=5" defer></script>
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="section" style="padding-top:20px;">
      <div class="container">
        <div class="breadcrumbs" id="breadcrumbs"></div>
        <div id="product-detail" class="pro-detail"></div>
        <div id="related-section" style="margin-top:40px;">
          <h2 class="section-title" style="font-size:1.6rem;">منتجات ذات صلة</h2>
          <div id="related-grid" class="related-grid"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <button class="back-to-top" id="back-to-top" aria-label="للأعلى"><i class="fas fa-arrow-up"></i></button>
  <script>
    (function(){var b=document.getElementById('back-to-top');window.addEventListener('scroll',function(){b.classList.toggle('show',window.scrollY>400);});b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});})();
  </script>
</body>
</html>
