<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | Phoenix Kemet</title>
  <link rel="icon" type="image/png" href="images/emblem.png">
  <script src="js/version.js"></script>
  <link rel="stylesheet" href="css/all.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/products.js" defer></script>
  <script src="js/store.js" defer></script>
  <script src="js/layout.js" defer></script>
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <main>
    <section class="page-head"><div class="container"><div class="breadcrumb-ornament"><i class="fas fa-envelope"></i></div><h1>تواصل معنا</h1><p class="en">CONTACT US</p></div></section>
    <section class="section"><div class="container">
      <div class="contact-wrap">
        <div class="form-card">
          <form id="contact-form">
            <div class="field"><label>الاسم</label><input type="text" name="name" placeholder="اسمك الكريم" required></div>
            <div class="field"><label>البريد الإلكتروني</label><input type="email" name="email" placeholder="بريدك الإلكتروني" required></div>
            <div class="field"><label>الموضوع</label>
              <select name="topic">
                <option value="استفسار عام">استفسار عام</option>
                <option value="طلب منتج">طلب منتج</option>
                <option value="تعاون">تعاون</option>
                <option value="أخرى">أخرى</option>
              </select>
            </div>
            <div class="field"><label>الرسالة</label><textarea name="message" rows="5" placeholder="اكتب رسالتك هنا..." required></textarea></div>
            <button type="submit" class="btn">إرسال (واتساب)</button>
            <p class="form-note" id="form-note"></p>
          </form>
        </div>
        <div class="info-card">
          <h3 style="color:var(--green);margin-bottom:14px;">معلومات التواصل</h3>
          <ul>
            <li><i class="fab fa-whatsapp"></i><span>0155 831 5270</span></li>
            <li><i class="fas fa-envelope"></i><span>info@phoenixkemet.com</span></li>
            <li><i class="fas fa-clock"></i><span>أيام العمل، 9:00 - 18:00</span></li>
            <li><i class="fab fa-facebook-f"></i><a href="https://www.facebook.com/phoenixKemetegypt" target="_blank" rel="noopener">صفحتنا على فيسبوك</a></li>
          </ul>
          <div style="margin-top:18px;">
            <a class="wa-btn" href="https://wa.me/2015558315270" target="_blank" rel="noopener"><i class="fab fa-whatsapp"></i> راسلنا في واتساب</a>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <button class="back-to-top" id="back-to-top" aria-label="للأعلى"><i class="fas fa-arrow-up"></i></button>
  <script>(function(){var b=document.getElementById('back-to-top');window.addEventListener('scroll',function(){b.classList.toggle('show',window.scrollY>400);});b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});})();</script>
</body>
</html>
